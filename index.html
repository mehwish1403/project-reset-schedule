
<h2 class="sr-only">Project Reset — final daily schedule across Monday, VARC, and DILR days</h2>

<style>
  .sched { font-family: var(--font-sans); padding: 1rem 0; }
  .sched-header h1 { font-size: 18px; font-weight: 500; color: var(--text-primary); margin: 0 0 4px; }
  .sched-header p { font-size: 13px; color: var(--text-muted); margin: 0 0 1rem; }
  .day-tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .day-tab { font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); cursor: pointer; background: var(--surface-1); color: var(--text-secondary); }
  .day-tab.active { background: var(--fill-accent); color: var(--on-accent); border-color: var(--fill-accent); }
  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 1rem; }
  .sum-card { background: var(--surface-1); border-radius: var(--radius); padding: 10px 12px; }
  .sum-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .sum-val { font-size: 18px; font-weight: 500; color: var(--text-primary); }
  .sum-unit { font-size: 11px; color: var(--text-secondary); }
  .timeline { display: flex; flex-direction: column; gap: 3px; }
  .row { display: grid; grid-template-columns: 88px 1fr; gap: 10px; }
  .time-col { font-size: 12px; color: var(--text-muted); text-align: right; padding-top: 10px; white-space: nowrap; }
  .time-col .dur { display: block; font-size: 10px; opacity: 0.7; }
  .block { border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; min-height: 20px; }
  .block-label { font-size: 13px; font-weight: 500; line-height: 1.3; }
  .block-sub { font-size: 11px; margin-top: 2px; line-height: 1.4; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.25rem; padding-top: 1rem; border-top: 0.5px solid var(--border); }
  .leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
</style>

<div class="sched">
  <div class="sched-header">
    <h1>Project reset — final daily schedule</h1>
    <p>Fixed Fajr and Maghrib anchors, flexible Dhuhr/Asr/Isha windows, two sleep segments plus one nap</p>
  </div>

  <div class="day-tabs" id="dayTabs"></div>
  <div class="summary-bar" id="summaryBar"></div>
  <div class="timeline" id="timeline"></div>

  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#B4B2A9;"></div>Sleep</div>
    <div class="leg-item"><div class="leg-dot" style="background:#9FE1CB;"></div>Fajr / Maghrib (fixed, protected)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#CECBF6;"></div>VARC</div>
    <div class="leg-item"><div class="leg-dot" style="background:#FAC775;"></div>DILR</div>
    <div class="leg-item"><div class="leg-dot" style="background:#F0997B;"></div>Quant</div>
    <div class="leg-item"><div class="leg-dot" style="background:#85B7EB;"></div>Mock</div>
    <div class="leg-item"><div class="leg-dot" style="background:#F7C1C1;"></div>Nap</div>
  </div>
</div>

<script>
const colors = {
  sleep:  { bg: '#F1EFE8', text: '#444441' },
  prayer: { bg: '#E1F5EE', text: '#085041' },
  varc:   { bg: '#EEEDFE', text: '#3C3489' },
  dilr:   { bg: '#FAEEDA', text: '#633806' },
  quant:  { bg: '#FAECE7', text: '#4A1B0C' },
  mock:  { bg: '#E6F1FB', text: '#042C53' },
  nap:    { bg: '#FCEBEB', text: '#501313' },
  routine:{ bg: '#F5F5F5', text: '#444441' },
  free:   { bg: '#FAFAFA', text: '#888780' },
};

const days = [
  { id: 'mock', label: 'Mock/ Wed / Sat' },
  { id: 'daily', label: 'Daily' },
];

const summaries = {
  mock: [ { l: 'Mock', v: '3', u: 'hrs' }, { l: 'VARC', v: '1', u: 'hrs' }, { l: 'Quant', v: '3', u: 'hrs' }, { l: 'DILR', v: '2', u: 'hrs' } , { l: 'Nap', v: '1', u: 'hr' } ],
  daily: [ { l: 'VARC', v: '2', u: 'hrs' }, { l: 'Quant', v: '3', u: 'hrs' }, { l: 'DILR', v: '3', u: 'hrs' }, { l: 'Nap', v: '1', u: 'hr' } ],
};

const schedules = {
  mock: [
    { t: '11:30 PM', d: '6h', l: 'Main sleep', s: '', c: 'sleep' },
    { t: '5:30 AM', d: '25m', l: 'Fajr', s: 'Fixed window — nothing else scheduled', c: 'prayer' },
    { t: '5:55 AM', d: '1h 50m', l: 'Second sleep', s: '', c: 'sleep' },
    { t: '7:45 AM', d: '90m', l: 'Wake, freshen, breakfast', s: '', c: 'routine' },
    { t: '9:15 AM', d: '1h', l: 'VARC session', s: 'Reading + summary → RC passages → VA questions', c: 'varc' },
    { t: '10:15 AM', d: '2h', l: 'Mock', s: '', c: 'mock' },
    { t: '12:15 PM', d: '15m', l: 'Break', s: '', c: 'free'},
    { t: '12:30 PM', d: '1h', l: 'Review Mock', s: '', c: 'mock'},
    { t: '1:30 PM', d: '1h', l: 'Lunch + Dhuhr', s: 'Dhuhr window opens 12:45 — flexible', c: 'routine' },
    { t: '2:30 PM', d: '1h', l: 'Nap', s: '', c: 'nap' },
    { t: '3:30 PM', d: '1h 30m', l: 'Quant block A', s: 'Quant total = 1.5 hrs ✓', c: 'quant' },
    { t: '5:00 PM', d: '45m', l: 'Asr', s: 'Fixed window — nothing else scheduled', c: 'prayer' },
    { t: '5:45 PM', d: '1h', l: 'Quant block B', s: 'Quant total = 2.5 hrs ✓', c: 'quant'},
    { t: '6:45 PM', d: '45m', l: 'Maghrib', s: 'Fixed window — nothing else scheduled', c: 'prayer' },
    { t: '7:30 PM', d: '30m', l: 'Quant block C', s: 'Quant total = 3 hrs ✓', c: 'quant' },
    { t: '8:00 PM', d: '1h', l: 'DILR bock A', s: '', c: 'dilr' },
    { t: '9:00 PM', d: '30m', l: 'Dinner', s: '', c: 'routine' },
    { t: '9:30 PM', d: '1h', l: 'DILR bock B', s: '', c: 'dilr' },
    { t: '10:30 PM', d: '1h ', l: 'Daily log + wind down', s: 'Isha window 8:45–11:50 fits anywhere here', c: 'free' },
    { t: '11:30 PM', d: '', l: 'Sleep', s: '', c: 'sleep' },
  ],
  daily: [
    { t: '11:30 PM', d: '6h', l: 'Main sleep', s: '', c: 'sleep' },
    { t: '5:30 AM', d: '25m', l: 'Fajr', s: 'Fixed window — nothing else scheduled', c: 'prayer' },
    { t: '5:55 AM', d: '1h 50m', l: 'Second sleep', s: '', c: 'sleep' },
    { t: '7:45 AM', d: '90m', l: 'Wake, freshen, breakfast', s: '', c: 'routine' },
    { t: '9:15 AM', d: '2h', l: 'VARC session', s: 'Reading + summary → RC passages → VA questions', c: 'varc' },
    { t: '11:15 AM', d: '45m', l: 'Exercise', s: '', c: 'routine' },
    { t: '12:00 PM', d: '1h 30m', l: 'Quant block A', s: '', c: 'quant'},
    { t: '1:30 PM', d: '1h', l: 'Lunch + Dhuhr', s: 'Dhuhr window opens 12:45 — flexible', c: 'routine' },
    { t: '2:30 PM', d: '1h', l: 'Nap', s: '', c: 'nap' },
    { t: '3:30 PM', d: '1h 30m', l: 'Quant block B', s: 'Quant total = 3 hrs ✓', c: 'quant' },
    { t: '5:00 PM', d: '45m', l: 'Asr', s: 'Fixed window — nothing else scheduled', c: 'prayer' },
    { t: '5:45 PM', d: '1h', l: 'DILR session A', s: '3 sets solved + consolidated analysis', c: 'dilr'},
    { t: '6:45 PM', d: '45m', l: 'Maghrib', s: 'Fixed window — nothing else scheduled', c: 'prayer' },
    { t: '7:30 PM', d: '1h', l: 'DILR session B', s: '3 sets solved + consolidated analysis', c: 'dilr' },
    { t: '8:30 PM', d: '45m', l: 'Dinner', s: '', c: 'routine' },
    { t: '9:15 PM', d: '1h', l: 'DILR session C', s: 'DILR total=3 hrs', c: 'dilr' },
    { t: '10:15 PM', d: '1h 15m', l: 'Daily log + wind down', s: 'Isha window 8:45–11:50 fits anywhere here', c: 'free' },
    { t: '11:30 PM', d: '', l: 'Sleep', s: '', c: 'sleep' },
  ],
};

let current = 'daily';

function render() {
  document.getElementById('dayTabs').innerHTML = days.map(d =>
    '<div class="day-tab ' + (d.id === current ? 'active' : '') + '" onclick="switchDay(\'' + d.id + '\')">' + d.label + '</div>'
  ).join('');

  document.getElementById('summaryBar').innerHTML = summaries[current].map(s =>
    '<div class="sum-card"><div class="sum-label">' + s.l + '</div><div class="sum-val">' + s.v + ' <span class="sum-unit">' + s.u + '</span></div></div>'
  ).join('');

  document.getElementById('timeline').innerHTML = schedules[current].map(row => {
    const c = colors[row.c];
    return '<div class="row">' +
      '<div class="time-col">' + row.t + (row.d ? '<span class="dur">' + row.d + '</span>' : '') + '</div>' +
      '<div class="block" style="background:' + c.bg + ';">' +
        '<div class="block-label" style="color:' + c.text + ';">' + row.l + '</div>' +
        (row.s ? '<div class="block-sub" style="color:' + c.text + ';opacity:0.85;">' + row.s + '</div>' : '') +
      '</div></div>';
  }).join('');
}

function switchDay(id) { current = id; render(); }
render();
</script>
